[workspace]
members = [
    "crates/cama-app",
    "crates/cama-db",
    "crates/cama-domain",
    "crates/cama-runtime",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "UNLICENSED"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
chrono-tz = "0.10.4"
fs2 = "0.4.3"
fastrand = "2.3.0"
flate2 = "1.1.9"
fontdue = "0.9.4"
gif = "0.14.2"
getrandom = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend"] }
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# The runtime has a broad all-target test surface. Full debuginfo plus Cargo's
# per-crate incremental caches can exceed the storage available on development
# and CI hosts without affecting test behavior. Keep line tables for useful
# backtraces, disable duplicate incremental object caches, and leave release
# builds (including benchmarks) untouched.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
