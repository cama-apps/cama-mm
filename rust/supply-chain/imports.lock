[[audits.toolkit.audits.hybrid-array]]
who = "Koundinya Goparaju <koundinya.goparaju@gmail.com>"
criteria = "safe-to-deploy"
version = "0.4.13"
notes = "generic-array successor. 37 unsafe sites, same idioms audited sound in generic-array: repr(transparent) slice<->array casts with length equality from typenum, MaybeUninit assume_init after position-tracked initialization with a panic guard that drops the initialized prefix, flatten/unflatten via ManuallyDrop + ptr::read at checked_mul offsets. No fs/net/process/env, no build script."

[[audits.toolkit.audits.sha2]]
who = "Koundinya Goparaju <koundinya.goparaju@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.10.9 -> 0.11.0"
notes = "digest-0.11 migration. 59 unsafe sites, all in per-arch kernels (x86 SHA-NI/AVX2, aarch64, wasm32 simd128, riscv zknh, loongarch asm) reached only through guarded dispatch: compile_error! for compile-time backends, cpuid gating at runtime. riscv load_block branches on a runtime is_aligned() check before the aligned deref; fixed-size block/state arrays throughout; repr-transparent schedule casts. No fs/net/process/env, no build script."
