[[audits.toolkit.audits.block-buffer]]
who = "Koundinya Goparaju <koundinya.goparaju@gmail.com>"
criteria = "safe-to-deploy"
delta = "0.10.4 -> 0.12.1"
notes = "Rework onto hybrid-array. 22 unsafe sites, all documented invariant-based buffer ops: cursor position bounded by sealed BufferKind invariants before copy_nonoverlapping into remaining space, MaybeUninit assume_init after full writes, panic safety via ResetGuard Drop, ptr::read self-clone of a non-Drop type. No fs/net/process/env, no build script."

