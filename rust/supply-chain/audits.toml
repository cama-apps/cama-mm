[[audits.dirs-sys]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.5.0"
notes = """
Read complete two-file implementation and manifests. No build script, writes, network or process launch. Linux home fallback allocates a libc sysconf-sized buffer, passes actual capacity and live passwd/result storage to getpwuid_r, and copies the OS-provided NUL-terminated home directory before the buffer dies; non-success returns None. Windows known-folder pointer is copied while live and freed with CoTaskMemFree on both success/failure. OS libraries and HOME/XDG environment are trusted. UserDirs intentionally reads user-dirs.dirs as data, never evaluates shell escapes as commands. Found a safe panic for a one-byte quote value because [1..len-1] reverses its bounds; this does not affect Cama's sole ProjectDirs path, and requires malformed trusted local user configuration. Review discretion accepts that local-config failure, NOT a claim of arbitrary untrusted-config robustness. Tests reproduce the panic safely and verify ProjectDirs still succeeds without reading that file. Redox get_uid/basic-user lookup dependencies have separately scoped reviews; Linux deployment remains the supported Cama target.
Archive SHA256: e01a3366d27ee9890022452ee61b2b63a67e6f13f58900b651ff5665f0bb1fab.
"""

[[audits.jobserver]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.1.35"
notes = """
Reviewed all five source files and manifests, with deployment scope the Unix/Linux cc build-tool consumer and trusted Cargo/Make environment. No build script, downloaded code, shell command or network action. Linux creates CLOEXEC pipe descriptors atomically; from_env APIs are explicitly unsafe and require authentic inherited descriptors stable during validation/duplication. Cloned descriptors are owned Files; /dev/fd reopening allows private nonblocking flags and fallback duplication sets CLOEXEC. Acquire/read/poll and release/write use one-byte buffers and typed live syscall arguments; FIONREAD initializes output before it is assumed initialized. Acquired tokens retain Arc<Client> until release, helper state uses Mutex/Condvar/Arc and shutdown signals only its retained joinable thread. The documented global SIGUSR1 handler is intentional build-process behavior; helper failure/abnormal exit can lose tokens or leave a thread, a build-liveness limitation. Environment-provided FIFO paths are trusted capabilities (not validated as FIFOs), and raw from_env(check_pipe=false) must not receive attacker-selected files. configure captures raw descriptor numbers in a pre_exec closure, so the client must remain alive through child spawn; Cama's cc1.4.2 consumer retains the inherited client in a static OnceLock and does not call configure. No unrestricted claim for applications with competing signal handlers, untrusted MAKEFLAGS, or different fd lifetimes. Windows/Wasm code also inspected, but not executed or part of this Linux build scope. Standalone Linux checks pass for token RAII, configured child inheritance/return, four malformed/closed-descriptor environments, helper delivery/shutdown, and blocked-helper interruption. No existing Cargo jobserver tokens were consumed by tests; an isolated fresh client was used.
Archive SHA256 verified against Cargo.lock: 1c00acbd29eabad4a2392fa0e921c874934dbbf4194312ad20f04a0ed67a3cb3.
"""

