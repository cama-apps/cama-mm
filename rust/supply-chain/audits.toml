[[audits.toml_edit]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.25.14+spec-1.1.0"
notes = """
Reviewed manifests, all unsafe/powerful-import sites (no unsafe code), parser entrypoints, value/key conversion, recursion guards, formatting/error paths and dependency interactions. Parsing is in-memory; input token/event collections are proportional to caller input. Default parsing uses RecursionGuard depth80 and limits dotted key paths; scalar conversion reports integer/float overflow and rejects invalid Unicode via the parser dependency. Optional debug prints parsing diagnostics to stderr; no network, process, environment or filesystem capability is introduced. The explicitly unbounded feature removes depth protection and is excluded from this Cama deployment review; keep it disabled with the dependency feature guard. Safe-feature toml_parser and winnow are independently reviewed. Tests cover malformed Unicode escapes, numeric overflow, depth500 arrays/key paths, and 10,000 deterministic malformed UTF-8-valid inputs without panic. This is a security-sensitive-operation review, not exhaustive TOML conformance certification.
