[[audits.winnow]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "1.0.4"
notes = """
Reviewed all unsafe declarations/operations and their surrounding ownership/bounds contracts, manifests, powerful imports, and parser progress checks. Bytes/BStr reference transmutations preserve the transparent [u8] representation and lifetime. All unchecked slicing methods are explicitly unsafe APIs requiring caller-valid bounds and UTF-8 boundaries; wrapper implementations forward the same contract to their inner stream. Safe parser operations do not invoke unchecked slicing. Optional debug tracing writes caller parser/input diagnostics to stderr and reads terminal width/COLUMNS; this is intentional opt-in behavior, not secret discovery or network access. No build script, process launch, filesystem reads/writes, FFI, or assembly. Repetition combinators check progress to avoid empty-parser infinite loops. Caller-defined grammars still control recursion/backtracking and resource budgets. UTF-8 boundaries and arbitrary byte wrapper tests pass. This is a safety/powerful-operation review, not exhaustive correctness verification of every grammar combinator.
Archive SHA256: 23b97319f7b8343df12cc98938e5c3eb436064524c8d2b4e30a1d3a36eecdf81.
"""

[[audits.zstd-sys]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "2.1.0+zstd.1.5.7"
notes = """
Verified registry archive SHA-256 0ef0a8027ec3ee71300ab3bcbcd0393f434aa72b91ca6d635a39941deae8eea0 and all 129 extracted files. All 104 bundled native source/build/license files are byte-identical to upstream facebook/zstd v1.5.7.
Read build.rs and FFI entrypoint/feature selection: bundled source compilation,
expected compiler/OUT_DIR operations, no source download or unrelated execution.
Reviewed native frame header length/reserved-bit/window parsing, streaming input
and output bounds/state transitions, window-limit-before-allocation checks,
compressed-block/literal limits, sequence copy slow/fast-path margins and history
offsets, Huffman table/stream initialization and finishing bounds, and FSE table
workspace/entropy decoding bounds. Scanned native sources for ambient capabilities;
normal runtime is compression/decompression and allocation. Raw FFI callers must
honor C pointer/size/lifetime contracts; the separately patched Rust wrapper now
validates public cursors and holds prepared dictionaries for their retained life.
Production feature scope is std only (no bindgen, pkg-config, legacy, dictionary
builder, seekable, experimental or threading). Upstream native regression tests
and 200 seeded fuzz trials passed on the matching source under ASan and UBSan;
LeakSanitizer was disabled because sandbox ptrace prevents it. Upstream OSS-Fuzz
configuration confirms ongoing address/memory/undefined sanitizer targets.
Discretion: substantive boundary/allocation/decoder review plus verified source
identity and bounded sanitizer evidence supports deployment; not every native
algorithm/assembly instruction was read and tests are not exhaustive proof. No
matching previous full safe-to-deploy native anchor was assumed. Production also
caps decoder window at 64 MiB and downloaded/decompressed metadata sizes. Optional
features require additional review; this attestation does not certify the
unpatched zstd/zstd-safe prepared-dictionary and output-initialization defects.
"""
