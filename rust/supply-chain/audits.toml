criteria = "safe-to-deploy"
version = "0.5.2"
notes = """
SCOPED TO CAMA'S directories -> dirs-sys -> target_os=redox fallback with auth disabled; enforce reverse-dependency, feature and Linux-deployment guards. Read complete runtime source including excluded authentication/admin paths and manifests. No unsafe code/build script. The reviewed fallback gets current UID and reads AllUsers::basic(Config::default()), then finds that UID and copies its home path. Default Config opens /etc/passwd read-only with a Redox shared lock; semicolon splitting uses checked Option/numeric parsing; all file storage is owned and dropped normally. No password/shadow read, write, command execution or user mutation is invoked by this path. Broader administration APIs are NOT certified: login_cmd relies on caller identity-range and environment/group policy, account serialization rejects semicolons but does not reject newline injection in all mutable fields, writes truncate rather than atomically replace, and non-Redox file locking is intentionally absent. Those APIs are neither called by dirs-sys nor compiled into Cama's Linux runtime. The Redox OS runtime was not available for execution testing; no account files were modified.
Archive SHA256: a4e608c6638b9c18977b00b475ac1f28d14e84b27d8d42f70e0bf1e3dec127ac.
"""

[[audits.rsa]]
who = "Codex (automated source review)"
criteria = ["safe-to-run", "rsa-public-key-encryption"]
version = "0.9.10"
notes = "Archive SHA-256 b8573f03f5883dcaebdfcf4725caa1ecb9c15b2ef50c43a07b816e06799bb12d. Manifest build=false; source has no unsafe code or ambient filesystem/network/process operations. Read RsaPublicKey construction/checking and PKCS#1 v1.5/OAEP encryption paths, padding/MGF, and rsa_encrypt public modular exponentiation. Default public-key constructor limits modulus to 4096 bits and exponent to 2..2^33-1, rejecting even modulus/exponent and exponent >= modulus. Encryption validates message size before padding allocation; its padding RNG requires CryptoRngCore and Steam's wrapper supplies rand thread_rng. No private RSA key is held or used by this application: Steam integrations only decode/build RsaPublicKey, read public n/e, encrypt password/session-key bytes, and expose unused public signature verification. The known RUSTSEC-2023-0071/Marvin private-key timing vulnerability is acknowledged, NOT audited away. Do not import this as safe-to-deploy for private-key use. Enforce scoped inverse dependency and callsite constraints in CI; independently audit every primitive dependency."

