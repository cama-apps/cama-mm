SCOPED TO CAMA WITH THE unsafe FEATURE DISABLED, enforced by the repository dependency feature guard. Read manifests, unsafe operation sites, source/span APIs, lexer/parser boundaries, decoder validation and recursion-guard integration. The normal compiled configuration forbids unsafe code and uses checked string/slice indexing. No build script or ambient network/filesystem/process capability; optional debug writes diagnostics. With the explicitly opt-in unsafe feature, public safe ValidateWhitespace receiver methods can pass caller-invalid spans to Source::get_unchecked; this configuration is NOT certified. Span::new_unchecked is itself safe and does not validate bounds. Cama must continue consuming this package through toml_edit normal parser flow with unsafe disabled. Tests of that flow cover invalid Unicode, malformed syntax, depth limits and 10,000 generated inputs. No UB was executed when investigating the excluded configuration.
