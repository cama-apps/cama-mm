[[audits.bzip2]]
who = "Codex (automated source review)"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = """
Verified registry archive SHA-256 f3a53fac24f34a81bc9954b5d6cfce0c21e18ec6959f44f56e8e90e4bb7c346c and all 18 extracted files.
Read all runtime modules: lib, mem, read, bufread, and write. No build script or
ambient filesystem/network/process/environment access. Reviewed every unsafe
boundary: stable boxed native stream address and matching destruction, borrowed
nonoverlapping slice pointers, u32 length clamping, total-output accounting before
Vec initialization/length updates, and Send/Sync with mutation requiring exclusive
access. Reader truncation/error/progress and multistream reset paths preserve
