[package]
name = "cama-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Rustc compiles a crate's unit tests as one frontend/codegen unit. Keep the
# complete suite as the local default, while CI selects these balanced groups
# independently so the large runtime test harnesses can compile in parallel.
default = ["runtime-test-all"]
runtime-test-all = [
    "runtime-test-core",
    "runtime-test-dig",
    "runtime-test-draft",
    "runtime-test-match",
]
runtime-test-core = []
runtime-test-dig = []
runtime-test-draft = []
runtime-test-match = []

[[bin]]
name = "cama-rust"
path = "src/main.rs"
test = false

# This target source-includes the draft provider as a compile-closed checker.
# Clippy/check still build it; running its inherited unit tests would duplicate
# the same 56 tests already executed through the library target.
[[bin]]
name = "draft_provider_check"
path = "src/bin/draft_provider_check.rs"
test = false

# These targets remain production build/clippy targets. Their tests are
# source-included in the library's core test shard so CI only has to compile
# one runtime test harness.
[[test]]
name = "runtime_lifecycle"
path = "tests/runtime_lifecycle.rs"
test = false

[[example]]
name = "profile_snapshot_smoke"
path = "examples/profile_snapshot_smoke.rs"
test = false

[dependencies]
cama-app = { path = "../cama-app" }
cama-db = { path = "../cama-db" }
cama-domain = { path = "../cama-domain" }
async-trait.workspace = true
chrono.workspace = true
fastrand.workspace = true
fs2.workspace = true
fontdue.workspace = true
getrandom.workspace = true
gif.workspace = true
serenity.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
