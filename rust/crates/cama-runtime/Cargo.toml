[package]
name = "cama-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cama-rust"
path = "src/main.rs"

# This target source-includes the draft provider as a compile-closed checker.
# Clippy/check still build it; running its inherited unit tests would duplicate
# the same 56 tests already executed through the library target.
[[bin]]
name = "draft_provider_check"
path = "src/bin/draft_provider_check.rs"
test = false

[dependencies]
cama-app = { path = "../cama-app" }
cama-db = { path = "../cama-db" }
cama-domain = { path = "../cama-domain" }
async-trait.workspace = true
chrono.workspace = true
fastrand.workspace = true
fs2.workspace = true
fontdue.workspace = true
getrandom.workspace = true
gif.workspace = true
serenity.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
