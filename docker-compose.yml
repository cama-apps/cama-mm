services:
  bot:
    image: ${RUST_RUNTIME_IMAGE_LOCAL:-cama-mm-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: "always"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/cama_shuffle.db
      BOT_RUNTIME: rust
      # Steam static image caches live on the persisted data mount. Override
      # STEAM_IMAGE_CACHE_ROOT when deploying to another durable volume.
      STEAM_IMAGE_CACHE_ROOT: ${STEAM_IMAGE_CACHE_ROOT:-/app/data/image-cache}
    command: ["serve"]
    user: "1001:1001"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    stdin_open: true
    tty: true
