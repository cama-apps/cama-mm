<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/curfew.css">
<style>
 html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}
 body{background:#0f1220;color:#e9e9f5;font-family:"IBM Plex Sans",sans-serif;

   background-image:radial-gradient(circle at 86% 14%, #9d90ff33, transparent 58%)}

 h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:92px;line-height:1;margin:0 0 28px}
 p{font-size:30px;line-height:1.45;color:#a0a2c0;margin:0;max-width:33ch}
 .rule{margin-top:44px;padding-top:24px;border-top:1px solid #9d90ff44;
   font-family:"IBM Plex Mono",monospace;font-size:20px;color:#a0a2c0;letter-spacing:.06em}
</style></head><body>
 <div class="eyebrow"><i></i>Cama · Player Guide</div>
 <h1>Curfew</h1>
 <p>Lock yourself out of the lobby on a schedule you set. Blocks queueing, quietly removes you.</p>
 <div class="rule">/PLAYER CURFEW ADD</div>
