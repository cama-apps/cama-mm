<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/ready-signal.css">
<style>
 html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden}

 h1{font-family:"Big Shoulders Display", sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em;
   font-size:104px;line-height:1.0;margin:0 0 28px;max-width:16ch}
 p{font-size:30px;line-height:1.45;color:#9aa5b3;margin:0;max-width:34ch}
 .rule{margin-top:44px;padding-top:24px;border-top:1px solid #ff6a2b44;
   font-family:"IBM Plex Mono", monospace;font-size:20px;color:#9aa5b3;letter-spacing:.06em}

 <div class="eyebrow"><i></i>Cama · Player Guide</div>
 <h1>Ready Signal</h1>
