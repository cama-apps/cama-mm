name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        env:
          BOT_RUNTIME_SELECTION: ${{ vars.BOT_RUNTIME }}
          RUST_CUTOVER_CANDIDATE_SELECTION: ${{ vars.RUST_CUTOVER_CANDIDATE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: cama
          key: ${{ secrets.SSH_KEY }}
          envs: BOT_RUNTIME_SELECTION,RUST_CUTOVER_CANDIDATE_SELECTION
          script: |
            set -eu
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            cd ~/cama-mm
            git fetch origin main
            git checkout --force "$DEPLOY_SHA"
            if [ -n "${BOT_RUNTIME_SELECTION:-}" ]; then
              BOT_RUNTIME="$BOT_RUNTIME_SELECTION"
              export BOT_RUNTIME
            else
              unset BOT_RUNTIME
            fi
            if [ "${RUST_CUTOVER_CANDIDATE_SELECTION:-}" = true ]; then
              RUST_CUTOVER_CANDIDATE=true
              export RUST_CUTOVER_CANDIDATE
            else
              unset RUST_CUTOVER_CANDIDATE
            fi
            GIT_SHA="$DEPLOY_SHA" ./scripts/deploy-runtime
