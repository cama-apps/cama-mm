name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy immutable Rust image
        uses: appleboy/ssh-action@v1.2.2
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_RUNTIME_IMAGE: ghcr.io/${{ github.repository }}-rust:${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: cama
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,RUST_RUNTIME_IMAGE
          command_timeout: 15m
          script: |
            set -eu
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            cd ~/cama-mm
            git fetch origin main
            git checkout --force "$DEPLOY_SHA"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            export RUST_RUNTIME_IMAGE
            GIT_SHA="$DEPLOY_SHA" ./scripts/deploy-runtime
