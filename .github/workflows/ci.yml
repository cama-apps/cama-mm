name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: rust/target
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Create locked Python environment for cross-language Rust tests
        run: uv sync --locked

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache compiler objects
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./rust -> target"
          shared-key: rust-ci
          cache-on-failure: true

      - name: Lint Python
        run: uv run --locked ruff check .

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint and compile Rust
        run: >-
          cargo clippy --locked --manifest-path rust/Cargo.toml
          --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: >-
          cargo test --locked --manifest-path rust/Cargo.toml
          --workspace --all-targets --all-features

      - name: Build release runtime
        run: >-
          cargo build --locked --manifest-path rust/Cargo.toml
          --release --package cama-runtime --bin cama-rust

      - name: Stage runtime binary
        run: |
          mkdir -p .cama-build
          cp rust/target/release/cama-rust .cama-build/cama-rust

      - name: Upload runtime binary
        uses: actions/upload-artifact@v7
        with:
          name: cama-rust-${{ github.sha }}
          path: .cama-build/cama-rust
          if-no-files-found: error
          retention-days: 1

  runtime-images:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download runtime binary
        uses: actions/download-artifact@v8
        with:
          name: cama-rust-${{ github.sha }}
          path: .cama-build

      - name: Restore executable bit
        run: chmod 0755 .cama-build/cama-rust

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Rust runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.rust
          target: runtime-prebuilt
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}-rust:${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=cama-rust-runtime
          cache-to: type=gha,mode=max,scope=cama-rust-runtime
