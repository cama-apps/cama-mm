name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Install checksum-verified cargo-vet
        run: .github/scripts/install-cargo-vet

      - name: Forbid new unaudited exemptions
        run: .github/scripts/check-cargo-vet-exemptions "${{ github.event.pull_request.base.sha }}"

      # Fetching reads package manifests but does not compile build scripts.
      # Vetting must succeed before any job is allowed to build third-party code.
      - name: Fetch the locked dependency graph
        run: cargo fetch --locked --manifest-path rust/Cargo.toml

      - name: Require an approved dependency graph
        run: cargo vet check --locked --manifest-path rust/Cargo.toml

  rust-tests:
    name: Rust tests (${{ matrix.name }})
    needs: dependency-policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cama-domain
            package: cama-domain
            arguments: --all-targets --all-features
          - name: cama-db
            package: cama-db
            arguments: --all-targets --all-features
          - name: cama-app
            package: cama-app
            arguments: --all-targets --all-features
          - name: cama-app-dig
            package: cama-app-dig
            arguments: --all-targets --all-features
          - name: cama-app-gameplay
            package: cama-app-gameplay
            arguments: --all-targets --all-features
          - name: cama-app-match
            package: cama-app-match
            arguments: --all-targets --all-features
          - name: cama-app-platform
            package: cama-app-platform
            arguments: --all-targets --all-features
          - name: cama-runtime-core
            package: cama-runtime
            arguments: >-
              --lib --no-default-features
              --features runtime-test-core
          - name: cama-runtime-dig
            package: cama-runtime
            arguments: >-
              --lib --no-default-features
              --features runtime-test-dig
          - name: cama-runtime-draft
            package: cama-runtime
            arguments: >-
              --lib --no-default-features
              --features runtime-test-draft
          - name: cama-runtime-match
            package: cama-runtime
            arguments: >-
              --lib --no-default-features
              --features runtime-test-match
    env:
      CARGO_TARGET_DIR: rust/target
      # CI failures already report assertion locations, while debug line tables
      # materially increase cold compile time and artifact size.
      CARGO_PROFILE_TEST_DEBUG: "0"
      # The pinned compiler contains the experimental parallel frontend. Match
      # the four cores on public Linux runners without changing tool versions.
      RUSTC_BOOTSTRAP: "1"
      RUSTFLAGS: "-Zthreads=4"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./rust -> target"
          shared-key: rust-ci-tests-${{ matrix.name }}
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Test ${{ matrix.name }}
        run: >-
          cargo test --locked --manifest-path rust/Cargo.toml
          --package ${{ matrix.package }} ${{ matrix.arguments }}

  rust-lint:
    needs: dependency-policy
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: rust/target
      RUSTC_BOOTSTRAP: "1"
      RUSTFLAGS: "-Zthreads=4"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./rust -> target"
          shared-key: rust-ci-lint
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint and compile Rust
        run: >-
          cargo clippy --locked --manifest-path rust/Cargo.toml
          --workspace --all-targets --all-features -- -D warnings

  # Preserve the existing required status while the full workspace suite runs
  # package-by-package in parallel. Every workspace member is listed explicitly
  # so adding a crate requires a deliberate CI update.
  rust:
    if: ${{ always() }}
    needs: rust-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every Rust test shard
        env:
          RUST_TEST_RESULT: ${{ needs.rust-tests.result }}
        run: test "$RUST_TEST_RESULT" = success

  # Retain the existing required status context without rebuilding the release
  # artifact on every PR. The main-only Release workflow owns compilation,
  # publication, and the deploy handoff.
  runtime-images:
    needs: [dependency-policy, rust, rust-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify main-only runtime image contract
        run: |
          test -f .github/workflows/release.yml
          grep -Fq 'Stage latest runtime data' .github/workflows/release.yml
          grep -Fq 'target: runtime-prebuilt' .github/workflows/release.yml
          grep -Fq 'push: true' .github/workflows/release.yml
          grep -Fq 'workflows: [Release]' .github/workflows/deploy.yml
          grep -Fq 'ENV GIT_SHA=${GIT_SHA}' Dockerfile.rust
          ! grep -E 'setup-uv|uv (run|sync)|(^|[[:space:]])python3?([[:space:]]|$)' \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .github/workflows/deploy.yml \
            scripts/deploy-runtime \
            scripts/post-deploy-verify \
            scripts/runtime-compose \
            scripts/runtime-entrypoint \
            docker-compose.yml \
            Dockerfile.rust \
            | grep -v "grep -E 'setup-uv"
